[project]
name = "tavenierpy"
description = "A discord bot written in python."
authors = [
	{ name = "ippei", email = "dev.brillarm@gmail.com" },
]
dynamic = ["version", "readme"]
requires-python = ">=3.13.3"


[tool.poetry]
version = "2025.1.0"
readme = ["README.md"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13.3"
discord = "^2.3.2"
loguru = "^0.7.2"
yt-dlp = "^2024.10.22"
pynacl = "^1.5.0"
spotipy = "^2.25.0"
typer = "^0.15.2"


[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
pre-commit = "^4.0.1"
isort = "^5.13.2"
flake8 = "^7.1.1"


[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.5.34"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
